<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reloj</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        #time {
            font-size: 18vw;
            font-weight: 700;
            line-height: 1;
        }
        #date {
            font-size: 4vw;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div id="time">00:00 AM</div>
    <div id="date">-- -- ----</div>
    <script>
        const TZ = 'America/Monterrey';
        const params = new URLSearchParams(window.location.search);
        const offsetMs = parseFloat(params.get('offset') || '0') * 60 * 60 * 1000;

        function updateClock() {
            const now = new Date(Date.now() + offsetMs);

            const timeParts = new Intl.DateTimeFormat('en-US', {
                timeZone: TZ,
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            }).formatToParts(now);

            const dateParts = new Intl.DateTimeFormat('es-MX', {
                timeZone: TZ,
                weekday: 'long',
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            }).formatToParts(now);

            const hour = timeParts.find(p => p.type === 'hour').value;
            const minute = timeParts.find(p => p.type === 'minute').value;
            const ampm = timeParts.find(p => p.type === 'dayPeriod').value.toUpperCase();

            const weekday = dateParts.find(p => p.type === 'weekday').value;
            const day = dateParts.find(p => p.type === 'day').value;
            const month = dateParts.find(p => p.type === 'month').value;
            const year = dateParts.find(p => p.type === 'year').value;

            document.getElementById('time').textContent = `${hour}:${minute} ${ampm}`;
            document.getElementById('date').textContent =
                `${weekday}, ${day} de ${month} de ${year}`.toUpperCase();
        }

        function scheduleUpdate() {
            updateClock();
            const now = new Date();
            const msUntilNextMinute = (60 - now.getSeconds()) * 1000 - now.getMilliseconds();
            setTimeout(scheduleUpdate, msUntilNextMinute);
        }

        scheduleUpdate();
    </script>
</body>
</html>
