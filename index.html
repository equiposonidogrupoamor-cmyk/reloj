<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reloj CDMX</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        #time {
            font-size: 18vw;
            font-weight: 700;
            line-height: 1;
        }
        #date {
            font-size: 4vw;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div id="time">00:00 AM</div>
    <div id="date">-- -- ----</div>
    <script>
        function updateClock() {
            // UTC puro - 6 horas, sin depender del timezone del navegador
            const cdmxDate = new Date(Date.now() + (-6 * 60 * 60000));

            let hours = cdmxDate.getUTCHours();
            const minutes = cdmxDate.getUTCMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            const timeString = `${hours}:${String(minutes).padStart(2, '0')} ${ampm}`;

            const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
            const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                           'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
            const dateString = `${dias[cdmxDate.getUTCDay()]}, ${cdmxDate.getUTCDate()} de ${meses[cdmxDate.getUTCMonth()]} de ${cdmxDate.getUTCFullYear()}`;

            document.getElementById('time').textContent = timeString;
            document.getElementById('date').textContent = dateString;
        }

        function scheduleUpdate() {
            updateClock();
            const now = new Date();
            const msUntilNextMinute = (60 - now.getSeconds()) * 1000 - now.getMilliseconds();
            setTimeout(scheduleUpdate, msUntilNextMinute);
        }

        scheduleUpdate();
    </script>
</body>
</html>
