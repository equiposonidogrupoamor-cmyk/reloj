<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reloj CDMX</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        #time {
            font-size: 18vw;
            font-weight: 700;
            line-height: 1;
        }
        #date {
            font-size: 4vw;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div id="time">00:00 AM</div>
    <div id="date">-- -- ----</div>

    <script>
        function updateClock() {
            const now = new Date();

            // Seteamos la zona horaria a CDMX específicamente
            const timeOptions = {
                timeZone: 'America/Mexico_City',
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            };

            const dateOptions = {
                timeZone: 'America/Mexico_City',
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            };

            // Formateamos hora y fecha usando el estándar internacional con la zona de CDMX
            let timeString = new Intl.DateTimeFormat('en-US', timeOptions).format(now);
            let dateString = new Intl.DateTimeFormat('es-MX', dateOptions).format(now);

            // Insertamos en el HTML
            document.getElementById('time').textContent = timeString;
            document.getElementById('date').textContent = dateString;
        }

        // Actualización cada segundo
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
