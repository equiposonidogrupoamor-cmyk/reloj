<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reloj Proyección</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        #time {
            font-size: 18vw; /* Un poco más grande al no tener segundos */
            font-weight: 700;
            line-height: 1;
        }
        #date {
            font-size: 4vw;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div id="time">00:00 AM</div>
    <div id="date">-- -- ----</div>

    <script>
        function updateClock() {
            const now = new Date();
            // AJUSTE: Sumamos 1 hora (3600000 ms) para que marque las 8:00
            const adjusted = new Date(now.getTime() + 3600000);

            // Formato de Hora (12h sin segundos)
            let h = adjusted.getHours();
            let m = adjusted.getMinutes();
            let ampm = h >= 12 ? 'PM' : 'AM';
            
            h = h % 12 || 12; // Convierte 0 a 12 para formato 12h
            m = m < 10 ? '0' + m : m;

            document.getElementById('time').textContent = `${h}:${m} ${ampm}`;

            // Formato de Fecha Largo (como el link original)
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = adjusted.toLocaleDateString('es-ES', options);
        }

        // Actualizamos cada segundo para que el cambio de minuto sea exacto
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
