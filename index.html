<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reloj Proyector</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff; /* Puedes cambiar esto por el color que quieras */
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        #time {
            font-size: 15vw;
            font-weight: 700;
            line-height: 1;
        }
        #date {
            font-size: 4vw;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div id="time">00:00:00</div>
    <div id="date">-- -- ----</div>

    <script>
        function updateClock() {
            const now = new Date();
            // AJUSTE: Sumamos 1 hora (3600000 milisegundos)
            const adjusted = new Date(now.getTime() + 3600000);

            // Formato de Hora (12h)
            let h = adjusted.getHours();
            let m = adjusted.getMinutes();
            let s = adjusted.getSeconds();
            let ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            m = m < 10 ? '0' + m : m;
            s = s < 10 ? '0' + s : s;

            document.getElementById('time').textContent = `${h}:${m}:${s} ${ampm}`;

            // Formato de Fecha (largo como en tu link)
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = adjusted.toLocaleDateString('es-ES', options);
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
